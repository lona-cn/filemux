[package]
name = "filemux-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true
license-file.workspace = true
readme.workspace = true
description = "HTTP, TFTP and NFSv3 file servers with persistent filesystem identities"
keywords = ["filemux", "file-sharing", "http", "tftp", "nfs"]
categories = ["network-programming", "filesystem"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
tokio.workspace = true
tokio-util.workspace = true
directories.workspace = true
tempfile.workspace = true
thiserror.workspace = true
cap-std.workspace = true
cap-fs-ext.workspace = true
rusqlite.workspace = true
uuid.workspace = true
axum = { workspace = true, features = ["multipart"] }
percent-encoding.workspace = true
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
fs2 = "0.4.3"
reqwest = { workspace = true, features = ["rustls-tls"] }
sha2 = "0.10"
flate2 = "1"
tar = "0.4"
socket-pktinfo = "0.4.1"
network-interface = "2.0.5"
socket2 = { version = "0.6", features = ["all"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_Networking_WinSock"] }


[target.'cfg(windows)'.dev-dependencies]
junction = "2"
