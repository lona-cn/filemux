[package]
name = "filemux-fs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true
license-file.workspace = true
readme.workspace = true
description = "Rooted capability filesystem with persistent object identities for Filemux"
keywords = ["filemux", "filesystem", "capability", "file-sharing"]
categories = ["filesystem"]

[dependencies]
cap-std.workspace = true
cap-fs-ext.workspace = true
rusqlite.workspace = true
uuid.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile.workspace = true

[target.'cfg(windows)'.dev-dependencies]
junction = "2"
