[package]
name = "filemux-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
repository.workspace = true
license.workspace = true
license-file.workspace = true
readme.workspace = true
description = "Read-only HTTP/1 file server backed by the Filemux rooted filesystem"
keywords = ["filemux", "http", "file-server", "file-sharing"]
categories = ["network-programming", "filesystem"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
filemux-core = { version = "0.1.0", path = "../filemux-core" }
filemux-fs = { version = "0.1.0", path = "../filemux-fs" }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
percent-encoding.workspace = true
tokio.workspace = true
tokio-util.workspace = true

[dev-dependencies]
reqwest.workspace = true
tempfile.workspace = true
